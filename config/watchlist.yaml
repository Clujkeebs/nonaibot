# Watchlist configuration
# core: symbols that are ALWAYS watched; the screener never removes these.
# dynamic: up to max_slots symbols the screener can add/remove automatically.
# veto: symbols the screener must NEVER propose (user-controlled exclusion list).

core:
  equities:
    - NLR       # uranium/nuclear ETF
    - SMH       # semiconductors ETF
    - LLY       # Eli Lilly (large-cap pharma)
  crypto:
    - SOL/USD   # Solana — core per spec
    - BTC/USD   # Bitcoin — anchor / volatility reference
    - ETH/USD   # Ethereum — second anchor

dynamic:
  max_slots: 5              # screener fills up to this many extra equity slots
  max_crypto_slots: 2       # screener fills up to this many extra crypto slots
  equities: []              # screener manages this list — do not edit manually
  crypto: []                # screener manages this list — do not edit manually

# Symbols the screener will NEVER propose (user veto list).
# Add tickers here to permanently block them from dynamic rotation.
veto: []

# --- Screener candidate pool ---
# The screener draws from this pool to find new dynamic candidates.
# Extend this list to give the screener more options to screen from.
# All must be tradable on Alpaca US equities.
