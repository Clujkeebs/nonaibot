# --- Screener filter criteria ---
screener:
  equity:
    min_avg_dollar_volume: 50000000   # $50M/day minimum liquidity
    min_price: 5.00                    # no penny stocks
    require_fractionable: true         # must support fractional orders
    min_return_20d: 0.02               # must be up at least 2% over last 20 days
    min_atr_pct: 0.005                 # must move at least 0.5% per day (not a dead stock)
    max_atr_pct: 0.10                  # not a meme rocket (max 10% daily ATR)
    top_n: 5                           # pick best N passing symbols

  crypto:
    min_return_7d: 0.0                 # must not be in freefall
    top_n: 2                           # pick best N passing crypto
