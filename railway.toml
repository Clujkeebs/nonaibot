[build]
# Build from the Dockerfile (python:3.11-slim) instead of nixpacks. nixpacks was
# failing while fetching nix packages from cache.nixos.org; Docker Hub + PyPI are
# more reliable on Railway and the build compiles nothing.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 10
