[build]
builder = "NIXPACKS"
# --prefer-binary: use prebuilt wheels for numpy/pandas (no slow source compile)
# --retries/--timeout: survive transient PyPI network blips during the build
buildCommand = "pip install --prefer-binary --retries 8 --timeout 180 -r requirements.txt"

[deploy]
startCommand = "python main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 10
